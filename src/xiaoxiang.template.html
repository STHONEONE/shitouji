<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#141e19"><title>潇湘馆 · 林黛玉</title>
<style>
:root{color-scheme:dark;font-family:"Microsoft YaHei",sans-serif;color:#e9e3d3;background:#141e19;--gold:#c8b279;--ink:#1b242b;--paper:#f3e9d5}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px 12px}button{font:inherit;cursor:pointer}button:focus-visible{outline:2px solid #f6d789;outline-offset:3px}main{width:min(960px,100%)}#scene{position:relative;width:100%;aspect-ratio:8/5;overflow:hidden;background:#263b2e;box-shadow:0 18px 60px #050d0b80;border:1px solid #736a48}#canvas{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none}.plaque{position:absolute;top:14px;z-index:2;background:#1c252be8;border:1px solid var(--gold);box-shadow:inset 0 0 0 3px #222d2a,inset 0 0 0 4px #706548;min-height:47px;padding:10px 22px;display:flex;align-items:center;gap:12px;font-family:"KaiTi","SimSun",serif;pointer-events:none}.place{left:14px;letter-spacing:6px;font-size:25px;color:#f0d89d}.identity{right:14px;color:#f1ebdd;font-size:17px;letter-spacing:2px}.flower{width:20px;height:20px;color:#d8a5ae}.controlbar{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);z-index:2;display:flex;align-items:center;justify-content:center;gap:17px;white-space:nowrap;background:#1d272bdc;border:1px solid #bda66b;padding:10px 18px;font-size:11px;color:#e6e1d2;max-width:95%}kbd{font:10px "Microsoft YaHei",sans-serif;color:#ffefd3;border:1px solid #b1ac97;border-radius:2px;padding:2px 4px;margin-right:5px;background:#2b3536}.separator{height:20px;width:1px;background:#807858}.controlbar .petals{color:#f0c8cc}#prompt{position:absolute;left:50%;bottom:66px;transform:translateX(-50%);z-index:3;font-size:12px;color:#ffedc8;background:#1c2b24ef;border:1px solid #b6a170;padding:8px 15px;white-space:nowrap;display:none}#dialogue{position:absolute;z-index:5;left:50%;bottom:67px;transform:translateX(-50%);width:min(600px,90%);padding:19px 24px 15px;background:var(--paper);border:1px solid #af935d;outline:1px solid #4e4538;outline-offset:-5px;color:#453e32;box-shadow:0 10px 36px #101c1780}#dialogue[hidden],#loading[hidden]{display:none}#speaker{font:20px "KaiTi","SimSun",serif;color:#3d5b4b;margin:0 0 9px}#dialogue-text{font:14px/1.9 "Microsoft YaHei",sans-serif;margin:0 0 12px}#dialogue-close{background:#354e3e;color:#fff1d1;border:1px solid #98835c;padding:7px 15px;font-size:12px;float:right}#dialogue:after{content:'';display:block;clear:both}#toast{position:absolute;top:78px;left:50%;transform:translateX(-50%);background:#243a2fee;color:#f9e7cc;padding:8px 16px;border:1px solid #a68e63;z-index:6;font-size:12px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}#toast.on{opacity:1}#loading{position:absolute;inset:0;background:#16271ef5;display:grid;place-content:center;text-align:center;z-index:10;padding:30px}#loading strong{font:28px "KaiTi","SimSun",serif;color:#e6c98d;letter-spacing:8px}#loading p{font-size:13px;color:#b7c3ad;line-height:2;max-width:500px}#retry{background:#38523f;border:1px solid #a98d5f;color:#f4e5c8;padding:9px 18px;font-size:13px}#retry[hidden]{display:none}.below{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 2px;color:#a6b49f;font-size:12px}.below p{margin:0;line-height:1.8}.below small{font-size:11px;color:#80917c}.tools{display:flex;gap:8px}.tools button{border:1px solid #5e6d54;background:#1f3025;color:#e0dfcb;padding:7px 11px;font-size:11px}#touch{position:absolute;inset:auto 12px 12px;display:none;justify-content:space-between;align-items:end;pointer-events:none;z-index:4}#touch button{pointer-events:auto;width:40px;height:37px;background:#1e3229c9;color:#f3e4c4;border:1px solid #bfa877;font-size:16px;touch-action:none}#dpad{display:grid;grid-template-columns:repeat(3,40px);gap:3px}#dpad [data-key=ArrowUp]{grid-column:2}#dpad [data-key=ArrowLeft]{grid-column:1}#touch-actions{display:flex;gap:8px}.interact-flash{animation:softflash .5s}@keyframes softflash{50%{filter:brightness(1.08)}}@media(max-width:700px){body{padding:8px}.plaque{top:8px;min-height:36px;padding:7px 12px}.place{left:8px;font-size:19px;letter-spacing:3px}.identity{right:8px;font-size:12px;letter-spacing:1px}.flower{width:15px;height:15px}.controlbar{display:none}#prompt{bottom:16px;font-size:10px;padding:6px 10px}#dialogue{bottom:14px;padding:12px 15px}#speaker{font-size:17px}#dialogue-text{font-size:12px;line-height:1.7}.below{font-size:11px}.below small{display:block}#toast{top:54px;font-size:10px}}@media(pointer:coarse){#touch{display:flex}.controlbar{display:none}#prompt{bottom:102px}#dialogue{bottom:104px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><main>
<section id="scene" aria-label="潇湘馆庭院，可操控林黛玉游览"><canvas id="canvas" width="960" height="600" aria-label="林黛玉与潇湘馆庭院"></canvas>
<div class="plaque place">潇湘馆</div><div class="plaque identity"><svg class="flower" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 10C3-1 1 13 9 13-2 19 13 26 13 16 20 26 27 11 17 12 28 4 12-2 12 10Z" fill="none" stroke="currentColor" stroke-width="1.2"/><circle cx="12" cy="12" r="2" fill="currentColor"/></svg><span>林黛玉 · 春日</span></div>
<div id="prompt" role="status"></div><div id="toast" role="status"></div>

</section>
<div class="below"><p>林黛玉的庭院<small>一庭竹影，半卷诗书。可在石桌、竹林与房门前停留。</small></p><div class="tools"><button id="help">查看操作</button><button id="reset">回到院中</button></div></div>
</main><script>

</script><script>
